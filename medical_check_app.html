<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0e14">
<title>検査補助</title>
<style>
  :root {
    --bg: #0a0e14; --bg1: #121821; --bg2: #1a2230;
    --line: #243042; --text: #e8edf5; --dim: #8a96a8; --mute: #5a6678;
    --accent: #4dd0c5; --warn: #f5a524; --danger: #f56565;
    --insight: #ffb454; --mistake: #ff6b8a; --r: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
  html { height: 100%; }
  body {
    min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased;
    padding-bottom: calc(env(safe-area-inset-bottom) + 72px);
    padding-top: env(safe-area-inset-top);
  }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  input, textarea { font-family: inherit; }

  /* Topbar */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    background: rgba(10,14,20,.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line); padding: 13px 16px 11px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .brand { font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .brand .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  .topbar-right { display: flex; gap: 4px; }
  .tbtn { padding: 6px 10px; border-radius: 8px; font-size: 13px; color: var(--dim); }
  .tbtn:active { background: var(--bg2); }
  .tbtn.accent { color: var(--accent); font-weight: 600; }

  /* Views */
  .view { display: none; padding: 16px; animation: fadein .15s ease; }
  .view.active { display: block; }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* Tabbar */
  .tabbar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
    display: grid; grid-template-columns: repeat(4, 1fr);
    background: rgba(10,14,20,.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid var(--line);
    padding: 4px 0 calc(4px + env(safe-area-inset-bottom));
  }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0; color: var(--mute); font-size: 10px; letter-spacing: .04em; }
  .tab.active { color: var(--accent); }
  .tab svg { width: 22px; height: 22px; }

  /* Home */
  .mod-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
  .mod-card {
    background: var(--bg1); border: 1px solid var(--line); border-radius: var(--r);
    padding: 16px 14px; position: relative; overflow: hidden; text-align: left; transition: transform .12s;
  }
  .mod-card:active { transform: scale(.97); }
  .mod-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--c, var(--accent)); }
  .mod-card .lbl { font-size: 10px; color: var(--mute); text-transform: uppercase; letter-spacing: .12em; margin-bottom: 4px; }
  .mod-card .name { font-size: 24px; font-weight: 800; }
  .mod-card .cnt { font-size: 12px; color: var(--dim); margin-top: 12px; }

  /* Proc list */
  .proc-item {
    background: var(--bg1); border: 1px solid var(--line); border-radius: var(--r);
    padding: 14px 16px; margin-bottom: 10px; display: flex; align-items: center;
    justify-content: space-between; gap: 8px; text-align: left; width: 100%; transition: transform .12s;
  }
  .proc-item:active { transform: scale(.98); }
  .proc-item .pt { font-size: 15px; font-weight: 600; }
  .proc-item .pd { font-size: 12px; color: var(--dim); margin-top: 2px; }

  /* Checklist */
  .prog-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .prog-bar { flex: 1; height: 4px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .prog-fill { height: 100%; background: var(--accent); transition: width .25s; }
  .prog-txt { font-size: 12px; color: var(--dim); white-space: nowrap; }
  .sec-title { font-size: 11px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .12em; margin: 0 4px 8px; display: flex; align-items: center; justify-content: space-between; }
  .sec-edit-btns { display: flex; gap: 4px; }
  .sec-edit-btns button { font-size: 11px; color: var(--mute); padding: 3px 8px; border-radius: 6px; }
  .sec-edit-btns button:active { background: var(--bg2); }

  /* Check item */
  .ci { background: var(--bg1); border: 1px solid var(--line); border-radius: var(--r); margin-bottom: 8px; overflow: hidden; transition: border-color .15s; }
  .ci.done { border-color: var(--accent); background: rgba(77,208,197,.06); }
  .ci.has-m { border-color: var(--mistake); background: rgba(255,107,138,.06); }
  .ci.has-i { border-color: var(--insight); background: rgba(255,180,84,.06); }
  .ci-top { display: flex; align-items: flex-start; gap: 12px; padding: 13px 14px 10px; cursor: pointer; user-select: none; -webkit-user-select: none; }
  .chk { flex-shrink: 0; width: 24px; height: 24px; border-radius: 7px; border: 1.5px solid var(--line); background: var(--bg); margin-top: 1px; display: grid; place-items: center; transition: all .15s; }
  .done .chk { background: var(--accent); border-color: var(--accent); }
  .done .chk::after { content: ""; width: 6px; height: 11px; border-right: 2px solid var(--bg); border-bottom: 2px solid var(--bg); transform: rotate(45deg) translate(-1px,-1px); }
  .ci-body { flex: 1; min-width: 0; }
  .ci-text { font-size: 14px; line-height: 1.5; }
  .done .ci-text { color: var(--dim); text-decoration: line-through; text-decoration-color: var(--mute); }
  .ci-note { font-size: 12px; color: var(--dim); margin-top: 5px; border-left: 2px solid var(--line); padding: 6px 8px; border-radius: 0 6px 6px 0; }
  .tag { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 10px; font-weight: 700; margin-left: 6px; vertical-align: 2px; background: var(--warn); color: #1a1a1a; }
  .tag.d { background: var(--danger); color: #fff; }
  .ci-btns { display: flex; gap: 6px; padding: 8px 12px 12px; border-top: 1px solid rgba(255,255,255,.05); }
  .ci-btn { flex: 1; padding: 9px 6px; border-radius: 8px; font-size: 12px; font-weight: 600; border: 1px solid var(--line); background: var(--bg); display: flex; align-items: center; justify-content: center; gap: 4px; transition: all .12s; line-height: 1; }
  .ci-btn:active { transform: scale(.96); }
  .ci-btn.mb { color: var(--mistake); border-color: rgba(255,107,138,.3); }
  .ci-btn.mb:active { background: rgba(255,107,138,.12); }
  .ci-btn.ib { color: var(--insight); border-color: rgba(255,180,84,.3); }
  .ci-btn.ib:active { background: rgba(255,180,84,.12); }
  .ci-btn.eb { color: var(--mute); flex: 0 0 44px; }
  .ci-btn.eb:active { background: var(--bg2); }
  .badges { padding: 0 14px 12px; display: grid; gap: 6px; }
  .badge { display: flex; align-items: flex-start; gap: 8px; padding: 8px 10px; border-radius: 8px; font-size: 13px; line-height: 1.45; }
  .badge.m { background: rgba(255,107,138,.12); border-left: 3px solid var(--mistake); }
  .badge.i { background: rgba(255,180,84,.12); border-left: 3px solid var(--insight); }
  .badge-body { flex: 1; word-break: break-word; }
  .badge-meta { font-size: 10px; color: var(--mute); margin-top: 2px; }
  .badge-del { color: var(--mute); font-size: 18px; padding: 0 4px; align-self: center; }
  .add-btn { width: 100%; border: 1.5px dashed var(--line); border-radius: var(--r); padding: 11px; color: var(--mute); font-size: 13px; margin-top: 8px; }
  .add-btn:active { border-color: var(--accent); color: var(--accent); background: rgba(77,208,197,.08); }

  /* Notes */
  .notes-filter { display: flex; gap: 6px; margin-bottom: 14px; overflow-x: auto; padding-bottom: 2px; }
  .nf-btn { flex-shrink: 0; padding: 6px 12px; border-radius: 99px; font-size: 12px; border: 1px solid var(--line); color: var(--dim); white-space: nowrap; }
  .nf-btn.active { background: var(--accent); color: #08120f; font-weight: 700; border-color: var(--accent); }
  .note-card { background: var(--bg1); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; margin-bottom: 10px; }
  .note-card.m { border-left: 3px solid var(--mistake); }
  .note-card.i { border-left: 3px solid var(--insight); }
  .note-card.q { border-left: 3px solid var(--accent); }
  .nc-head { display: flex; justify-content: space-between; font-size: 11px; color: var(--mute); margin-bottom: 6px; }
  .nc-typ.m { color: var(--mistake); font-weight: 700; }
  .nc-typ.i { color: var(--insight); font-weight: 700; }
  .nc-typ.q { color: var(--accent); font-weight: 700; }
  .nc-ctx { font-size: 12px; color: var(--dim); margin-bottom: 6px; }
  .nc-ctx b { color: var(--text); }
  .nc-text { font-size: 14px; word-break: break-word; }
  .nc-question { margin-top: 8px; padding: 8px 10px; border-radius: 8px; background: rgba(77,208,197,.08); border-left: 3px solid var(--accent); color: var(--text); font-size: 13px; word-break: break-word; }
  .nc-question b { color: var(--accent); font-size: 11px; margin-right: 4px; }
  .nc-actions { display: flex; gap: 6px; margin-top: 8px; justify-content: flex-end; }
  .nc-actions button { font-size: 11px; color: var(--mute); padding: 4px 8px; border-radius: 6px; }
  .nc-actions button:active { background: var(--bg2); }

  /* 参考タブ */
  .ref-card {
    background: var(--bg1); border: 1px solid var(--line); border-radius: var(--r);
    padding: 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px;
    text-decoration: none; color: var(--text); transition: transform .12s;
  }
  .ref-card:active { transform: scale(.98); }
  .ref-card .ri { font-size: 22px; flex-shrink: 0; }
  .ref-card .rb { flex: 1; min-width: 0; }
  .ref-card .rt { font-weight: 600; font-size: 14px; }
  .ref-card .rd { font-size: 12px; color: var(--dim); margin-top: 2px; }

  /* Sheet */
  .scrim { display: none; position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.55); }
  .scrim.on { display: block; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 51;
    background: var(--bg1); border-radius: 18px 18px 0 0;
    padding: 12px 18px calc(24px + env(safe-area-inset-bottom));
    transform: translateY(100%); max-height: 92vh; overflow-y: auto;
    transition: transform .25s cubic-bezier(.2,.8,.2,1);
    border-top: 1px solid var(--line);
  }
  .sheet.on { transform: translateY(0); }
  .grip { width: 36px; height: 4px; background: var(--line); border-radius: 99px; margin: 4px auto 16px; }
  .sheet h2 { font-size: 18px; margin-bottom: 8px; }
  .ctx-txt { font-size: 12px; color: var(--dim); background: var(--bg2); border-radius: 8px; padding: 8px 10px; margin-bottom: 14px; border-left: 2px solid var(--line); word-break: break-word; }
  .ctx-txt b { color: var(--text); }
  .form-lbl { font-size: 11px; color: var(--mute); text-transform: uppercase; letter-spacing: .12em; font-weight: 600; margin-bottom: 6px; display: block; }
  .form-input { width: 100%; background: var(--bg2); border: 1px solid var(--line); color: var(--text); border-radius: 10px; padding: 12px 14px; font: inherit; margin-bottom: 14px; }
  .form-input:focus { outline: none; border-color: var(--accent); }
  textarea.form-input { min-height: 100px; resize: vertical; font-size: 15px; }
  .type-banner { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 10px; margin-bottom: 14px; font-weight: 700; }
  .type-banner.m { background: rgba(255,107,138,.12); color: var(--mistake); border: 1px solid rgba(255,107,138,.3); }
  .type-banner.i { background: rgba(255,180,84,.12); color: var(--insight); border: 1px solid rgba(255,180,84,.3); }
  .type-banner .sw { margin-left: auto; font-size: 11px; font-weight: 600; color: var(--dim); padding: 4px 10px; border: 1px solid var(--line); border-radius: 99px; }
  .type-banner .sw:active { background: var(--bg2); }
  .target-change { display: flex; gap: 8px; align-items: flex-start; justify-content: space-between; }
  .target-change .ctx-txt { flex: 1; margin-bottom: 14px; }
  .target-btn { flex-shrink: 0; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); color: var(--accent); font-size: 12px; font-weight: 600; }
  .target-btn:active { background: rgba(77,208,197,.08); }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn-main { width: 100%; padding: 14px; border-radius: 10px; font-weight: 700; font-size: 15px; transition: opacity .1s; }
  .btn-main:active { opacity: .9; }
  .btn-main.a { background: var(--accent); color: #08120f; }
  .btn-main.m { background: var(--mistake); color: #fff; }
  .btn-main.i { background: var(--insight); color: #1a1a1a; }
  .btn-sub { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--line); color: var(--dim); font-size: 13px; margin-top: 8px; }
  .btn-sub:active { background: var(--bg2); }
  .btn-danger { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid rgba(245,101,101,.3); color: var(--danger); font-size: 13px; margin-top: 8px; }
  .btn-danger:active { background: rgba(245,101,101,.1); }

  /* Misc */
  .shdr { font-size: 11px; font-weight: 600; letter-spacing: .14em; color: var(--mute); text-transform: uppercase; margin: 4px 2px 10px; display: flex; align-items: center; justify-content: space-between; }
  .shdr .al { color: var(--accent); font-size: 12px; text-transform: none; font-weight: 600; padding: 4px 8px; border-radius: 6px; letter-spacing: 0; }
  .shdr .al:active { background: rgba(77,208,197,.1); }
  .hint { display: flex; gap: 10px; align-items: flex-start; background: var(--bg1); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; margin-bottom: 16px; font-size: 12.5px; color: var(--dim); }
  .hint b { color: var(--text); }
  .hint .hc { color: var(--accent); font-weight: 700; flex-shrink: 0; }
  .hint .hx { color: var(--mute); padding: 0 4px; flex-shrink: 0; }
  .empty { text-align: center; color: var(--mute); padding: 40px 16px; font-size: 13px; line-height: 1.8; }
  .toast { position: fixed; left: 50%; bottom: 88px; z-index: 100; transform: translateX(-50%) translateY(20px); background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 99px; font-size: 13px; font-weight: 600; opacity: 0; pointer-events: none; transition: all .25s; white-space: nowrap; }
  .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
  .search-hl { background: rgba(77,208,197,.25); color: var(--accent); border-radius: 3px; padding: 0 1px; }
  .pdf-add-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .pdf-add-btn { padding: 12px; border-radius: var(--r); font-size: 13px; font-weight: 600; text-align: center; cursor: pointer; }
  /* Quiz */
  .quiz-card { background:var(--bg1); border:1px solid var(--line); border-radius:var(--r); padding:16px; margin-bottom:12px; cursor:pointer; transition:all .15s; }
  .quiz-card:active { transform:scale(.98); }
  .quiz-card .qc-title { font-size:15px; font-weight:700; margin-bottom:6px; }
  .quiz-card .qc-meta { font-size:12px; color:var(--dim); display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .qc-badge { padding:2px 8px; border-radius:99px; font-size:10px; font-weight:700; }
  .q-prog-row { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .q-prog-bar { flex:1; height:4px; background:var(--line); border-radius:99px; overflow:hidden; }
  .q-prog-fill { height:100%; background:var(--accent); transition:width .3s; }
  .q-num { font-size:12px; color:var(--dim); white-space:nowrap; }
  .q-type-badge { font-size:10px; font-weight:700; padding:2px 8px; border-radius:99px; }
  .q-type-order { background:rgba(77,208,197,.2); color:var(--accent); }
  .q-type-truefalse { background:rgba(181,140,255,.2); color:#b48cff; }
  .q-type-fill { background:rgba(255,180,84,.2); color:var(--insight); }
  .q-type-choice { background:rgba(106,166,255,.2); color:#6aa6ff; }
  .q-question { font-size:16px; font-weight:600; line-height:1.55; margin-bottom:16px; }
  .sort-list { display:grid; gap:8px; margin-bottom:16px; }
  .sort-item { background:var(--bg1); border:1px solid var(--line); border-radius:10px; padding:12px 14px; display:flex; align-items:center; gap:10px; cursor:grab; transition:all .15s; user-select:none; -webkit-user-select:none; }
  .sort-item.drag-over { border-color:var(--accent); background:rgba(77,208,197,.1); transform:scale(1.01); }
  .sort-handle { color:var(--mute); font-size:18px; flex-shrink:0; }
  .sort-num { width:24px; height:24px; border-radius:50%; background:var(--bg2); color:var(--dim); font-size:12px; font-weight:700; display:grid; place-items:center; flex-shrink:0; }
  .sort-text { flex:1; font-size:14px; line-height:1.45; }
  .choice-list { display:grid; gap:8px; margin-bottom:16px; }
  .choice-btn { background:var(--bg1); border:1.5px solid var(--line); border-radius:10px; padding:13px 16px; text-align:left; font-size:14px; line-height:1.45; transition:all .15s; width:100%; }
  .choice-btn:active { transform:scale(.98); }
  .choice-btn.selected { border-color:var(--accent); background:rgba(77,208,197,.1); color:var(--accent); }
  .choice-btn.correct { border-color:#5ed29a; background:rgba(94,210,154,.12); color:#5ed29a; }
  .choice-btn.wrong { border-color:var(--danger); background:rgba(245,101,101,.1); color:var(--danger); }
  .fill-input { width:100%; background:var(--bg2); border:1.5px solid var(--line); color:var(--text); border-radius:10px; padding:13px 14px; font:inherit; font-size:15px; margin-bottom:14px; }
  .fill-input:focus { outline:none; border-color:var(--accent); }
  .fill-input.correct { border-color:#5ed29a; }
  .fill-input.wrong { border-color:var(--danger); }
  .q-feedback { padding:12px 14px; border-radius:10px; margin-bottom:14px; font-size:14px; line-height:1.6; }
  .q-feedback.ok { background:rgba(94,210,154,.12); border-left:3px solid #5ed29a; }
  .q-feedback.ng { background:rgba(245,101,101,.1); border-left:3px solid var(--danger); }
  .q-feedback .ans { font-weight:700; margin-top:4px; }
  .q-feedback .exp { color:var(--dim); font-size:13px; margin-top:4px; }
  .result-score { text-align:center; padding:24px 0 16px; }
  .score-num { font-size:64px; font-weight:800; line-height:1; }
  .score-max { font-size:20px; color:var(--dim); }
  .score-msg { font-size:16px; margin-top:10px; font-weight:600; }
  .result-item { background:var(--bg1); border:1px solid var(--line); border-radius:10px; padding:12px 14px; display:flex; gap:10px; align-items:flex-start; margin-bottom:8px; }
  .history-card { background:var(--bg1); border:1px solid var(--line); border-radius:var(--r); padding:12px 14px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; }
  .history-score { font-size:22px; font-weight:800; }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="dot"></span>検査補助</div>
  <div class="topbar-right">
    <button class="tbtn" id="backBtn" style="display:none;">‹ 戻る</button>
    <button class="tbtn accent" id="editBtn" style="display:none;">編集</button>
    <button class="tbtn accent" id="doneBtn" style="display:none;">完了</button>
  </div>
</header>

<!-- ホーム -->
<div class="view active" id="v-home">
  <p style="color:var(--dim);font-size:13px;margin:4px 2px 16px;">今日の検査を選択してください</p>
  <div class="shdr">モダリティ</div>
  <div class="mod-grid" id="mod-grid"></div>
  <!-- 目標管理 -->
  <div id="goal-wrap"></div>
</div>

<!-- 手順一覧 -->
<div class="view" id="v-procs">
  <div class="shdr">
    <span id="proc-lbl">手順</span>
    <button class="al" id="addProcBtn">+ 手順を追加</button>
  </div>
  <div id="proc-list"></div>
</div>

<!-- チェックリスト -->
<div class="view" id="v-check">
  <div class="prog-row">
    <span class="prog-txt" id="prog-txt">0 / 0</span>
    <div class="prog-bar"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
    <button class="tbtn" id="resetBtn" style="font-size:12px;">リセット</button>
  </div>
  <h2 id="check-title" style="font-size:20px;margin-bottom:14px;"></h2>
  <div class="hint" id="check-hint">
    <span class="hc">!</span>

      ]

// ============================================================
// STORAGE (IndexedDB)
// ============================================================
const DB = (() => {
  const NAME = "kensa_db_v2", VER = 1, STORE = "kv";
  let _db = null;

  function open() {
    if (_db) return Promise.resolve(_db);
    return new Promise((res, rej) => {
      const req = indexedDB.open(NAME, VER);
      req.onupgradeneeded = e => e.target.result.createObjectStore(STORE, { keyPath:"k" });
      req.onsuccess = e => { _db = e.target.result; res(_db); };
      req.onerror = e => rej(e);
    });
  }

  async function get(key, def) {
    try {
      const db = await open();
      return await new Promise((res, rej) => {
        const req = db.transaction(STORE,"readonly").objectStore(STORE).get(key);
        req.onsuccess = e => res(e.target.result ? e.target.result.v : def);
        req.onerror = e => rej(e);
      });
    } catch { return def; }
  }

  async function set(key, val) {
    try {
      const db = await open();
      await new Promise((res, rej) => {
        const tx = db.transaction(STORE,"readwrite");
        tx.objectStore(STORE).put({ k:key, v:val });
        tx.oncomplete = res; tx.onerror = rej;
      });
    } catch(e) { console.warn("DB set error", e); }
  }

  return { get, set };
})();

// ============================================================
// STATE
// ============================================================
const S = {
  data: null,
  currentMod: null,
  currentProc: null,
  checked: {},
  notes: [],
  editMode: false,
  notesFilter: "all",
  refTab: "proc"
};

function genId(p) { return p+"-"+Date.now().toString(36)+Math.random().toString(36).slice(2,5); }
const $ = id => document.getElementById(id);

// ============================================================
// VIEW CONTROL
// ============================================================
function showView(name) {
  document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
  $("v-"+name).classList.add("active");
  const map = { home:"home", procs:"home", check:"checklist", notes:"notes", quiz:"quiz", links:"links", goals:"home" };
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.t===(map[name]||"home")));
  $("backBtn").style.display = (name==="home"||name==="notes"||name==="links") ? "none" : "";
  $("editBtn").style.display = (name==="check" && !S.editMode) ? "" : "none";
  $("doneBtn").style.display = (name==="check" && S.editMode) ? "" : "none";
  if (name==="check") $("check-hint").style.display = localStorage.getItem("md_hint")==="1" ? "none" : "";
  if (name!=="check") S.editMode = false;
  window.scrollTo({ top:0, behavior:"instant" });
}

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("on");
  setTimeout(() => t.classList.remove("on"), 1800);
}

function esc(s) {
  return (s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function fmtDate(t) {
  const d = new Date(t);
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}

// ============================================================
// SHEET
// ============================================================
function openSheet(html) {
  $("sheet-body").innerHTML = html;
  $("scrim").classList.add("on");
  requestAnimationFrame(() => $("sheet").classList.add("on"));
}
function closeSheet() {
  $("sheet").classList.remove("on");
  $("scrim").classList.remove("on");
  setTimeout(() => { $("sheet-body").innerHTML = ""; }, 260);
}
$("scrim").onclick = closeSheet;
function closeHint() { localStorage.setItem("md_hint","1"); $("check-hint").style.display = "none"; }

// ============================================================
// HOME
// ============================================================
function renderHome() {
  $("mod-grid").innerHTML = S.data.modalities.map(m => {
    const cnt = (S.data.procedures[m.key]||[]).length;
    return `<button class="mod-card" style="--c:${m.c}" onclick="onMod('${m.key}')">
      <div class="lbl">${esc(m.sub)}</div>
      <div class="name">${esc(m.label)}</div>
      <div class="cnt">${cnt} 件の手順</div>
    </button>`;
  }).join("");
}

function onMod(key) {
  S.currentMod = key; renderProcs(); showView("procs");
}

// ============================================================
// PROCEDURES
// ============================================================
function renderProcs() {
  const mod = S.data.modalities.find(m => m.key===S.currentMod);
  $("proc-lbl").textContent = `${mod.label} / 手順`;
  const procs = S.data.procedures[S.currentMod]||[];
  const list = $("proc-list");
  if (!procs.length) { list.innerHTML = `<div class="empty">手順がまだありません<br>右上の「+ 手順を追加」から作成</div>`; return; }
  list.innerHTML = "";
  procs.forEach(p => {
    const btn = document.createElement("button");
    btn.className = "proc-item";
    btn.innerHTML = `
      <div style="flex:1;min-width:0;">
        <div class="pt">${esc(p.title)}</div>
        <div class="pd">${esc(p.desc||"")}</div>
      </div>
      <button style="color:var(--mute);padding:8px;border-radius:8px;font-size:16px;" data-act="edit">✎</button>
      <span style="color:var(--mute);font-size:18px;">›</span>`;
    btn.addEventListener("click", e => {
      if (e.target.closest("[data-act='edit']")) { e.stopPropagation(); openProcEditor(p); }
      else onProc(p.id);
    });
    list.appendChild(btn);
  });
}

function onProc(id) {
  S.currentProc = id; S.editMode = false;
  const mod = S.data.modalities.find(m => m.key===S.currentMod);
  $("check-title").textContent = `${mod.label} / ${getProc().title}`;
  renderCheck(); showView("check");
}

// ============================================================
// CHECKLIST
// ============================================================
function getProc() {
  return (S.data.procedures[S.currentMod]||[]).find(p => p.id===S.currentProc);
}

function renderCheck() {
  const proc = getProc(); if (!proc) return;
  if (!S.checked[proc.id]) S.checked[proc.id] = [];
  const doneSet = new Set(S.checked[proc.id]);
  const body = $("check-body"); body.innerHTML = "";

  proc.sections.forEach(sec => {
    const wrap = document.createElement("div");
    wrap.style.marginBottom = "22px";
    // セクション自体もドラッグ可能（編集モード）
    if (S.editMode) {
      wrap.setAttribute("draggable", "true");
      wrap.dataset.secId = sec.id;
    }

    const sh = document.createElement("div");
    sh.className = "sec-title";
    sh.innerHTML = `<span>${S.editMode ? '<span style="color:var(--mute);margin-right:6px;font-size:16px;">⠿</span>' : ""}${esc(sec.heading)}</span>`;
    if (S.editMode) {
      const eb = document.createElement("div");
      eb.className = "sec-edit-btns";
      eb.innerHTML = `<button onclick="editSec('${sec.id}')">編集</button><button onclick="delSec('${sec.id}')">削除</button>`;
      sh.appendChild(eb);
    }
    wrap.appendChild(sh);

    sec.items.forEach(it => {
      const notes = S.notes.filter(n => n.procId===proc.id && n.itemId===it.id);
      const hasM = notes.some(n => n.type==="mistake");
      const hasI = notes.some(n => n.type==="insight");
      const ci = document.createElement("div");
      ci.className = "ci" + (doneSet.has(it.id)?" done":"") + (hasM?" has-m":(hasI?" has-i":""));
      if (S.editMode) {
        ci.setAttribute("draggable", "true");
        ci.dataset.itemId = it.id;
        ci.dataset.secId = sec.id;
        ci.style.cursor = "grab";
      }

      const top = document.createElement("div");
      top.className = "ci-top";
      top.innerHTML = `
        ${S.editMode ? '<span style="color:var(--mute);font-size:20px;flex-shrink:0;padding-top:2px;">⠿</span>' : ""}
        <div class="chk"></div>
        <div class="ci-body">
          <div class="ci-text">${esc(it.text)}${it.warn?`<span class="tag">${esc(it.warn)}</span>`:""}${it.danger?`<span class="tag d">${esc(it.danger)}</span>`:""}</div>
          ${it.note?`<div class="ci-note">${esc(it.note)}</div>`:""}
        </div>`;
      top.addEventListener("click", () => {
        if (S.editMode) return;
        if (doneSet.has(it.id)) doneSet.delete(it.id); else doneSet.add(it.id);
        S.checked[proc.id] = [...doneSet];
        DB.set("md_checked", S.checked);
        renderCheck();
      });
      ci.appendChild(top);

      const btns = document.createElement("div");
      btns.className = "ci-btns";
      if (S.editMode) {
        btns.innerHTML = `
          <button class="ci-btn eb" data-a="ei">✎ 編集</button>
          <button class="ci-btn eb" data-a="di" style="color:var(--danger);">× 削除</button>`;
      } else {
        btns.innerHTML = `
          <button class="ci-btn mb" data-a="m">⚠ ミスを記録</button>
          <button class="ci-btn ib" data-a="i">💡 気づきを記録</button>`;
      }
      btns.querySelectorAll("button").forEach(b => {
        b.addEventListener("click", e => {
          e.stopPropagation();
          const a = b.dataset.a;
          if (a==="m") openNoteSheet(proc, it, "mistake");
          else if (a==="i") openNoteSheet(proc, it, "insight");
          else if (a==="ei") openItemEditor(sec, it);
          else if (a==="di") delItem(sec.id, it.id);
        });
      });
      ci.appendChild(btns);

      if (notes.length) {
        const bd = document.createElement("div");
        bd.className = "badges";
        bd.innerHTML = notes.map(n => `

    initCheckDrag();

}

// 編集モード: 長押しで並び替え（iOS Safari対応）
function initCheckDrag() {
  const body = $("check-body"); if (!body) return;

  let dragEl = null, dragType = null;
  let ghost = null, placeholder = null;
  let startX = 0, startY = 0;
  let activated = false, timer = null;

  function mkPlaceholder(h) {
    const el = document.createElement("div");
    el.style.cssText = "height:"+(h||52)+"px;background:rgba(77,208,197,.1);border:2px dashed var(--accent);border-radius:14px;margin-bottom:10px;box-sizing:border-box;";
    return el;
  }

  function mkGhost(src) {
    const r = src.getBoundingClientRect();
    const g = src.cloneNode(true);
    g.style.cssText = "position:fixed;left:"+r.left+"px;top:"+r.top+"px;width:"+r.width+"px;z-index:9999;pointer-events:none;opacity:.88;border-radius:14px;box-shadow:0 16px 40px rgba(0,0,0,.55);background:var(--bg1);border:2px solid var(--accent);transform:scale(1.04);transition:none;";
    document.body.appendChild(g);
    return g;
  }

  function cleanup() {
    clearTimeout(timer);
    activated = false;
    if (ghost) { ghost.remove(); ghost = null; }
    if (placeholder) { placeholder.remove(); placeholder = null; }
    if (dragEl) { dragEl.style.opacity = "1"; dragEl.style.visibility = ""; dragEl = null; }
    dragType = null;
  }

  function moveGhost(x, y) {
    if (!ghost) return;
    ghost.style.left = (x - ghost.offsetWidth / 2) + "px";
    ghost.style.top  = (y - 36) + "px";
  }

  function updatePlaceholderItem(y) {
    const items = [...body.querySelectorAll(".ci[data-item-id]")].filter(el => el !== dragEl);
    let placed = false;
    for (const t of items) {
      const r = t.getBoundingClientRect();
      if (y < r.top + r.height * 0.5) {
        t.parentNode.insertBefore(placeholder, t);
        placed = true; break;
      }
    }
    if (!placed) {
      // 一番下のセクション末尾に
      const secWraps = [...body.querySelectorAll("div[data-sec-id]")];
      for (let i = secWraps.length - 1; i >= 0; i--) {
        const r = secWraps[i].getBoundingClientRect();
        if (y >= r.top) {
          const addBtn = secWraps[i].querySelector(".add-btn");
          secWraps[i].insertBefore(placeholder, addBtn || null);
          placed = true; break;
        }
      }
    }
  }

  function updatePlaceholderSection(y) {
    const secs = [...body.querySelectorAll("div[data-sec-id]")].filter(el => el !== dragEl);
    let placed = false;
    for (const t of secs) {
      const r = t.getBoundingClientRect();
      if (y < r.top + r.height * 0.4) {
        body.insertBefore(placeholder, t);
        placed = true; break;
      }
    }
    if (!placed) {
      const lastBtn = body.querySelector(".add-btn:last-of-type");
      body.insertBefore(placeholder, lastBtn || null);
    }
  }

  // アイテム
  body.querySelectorAll(".ci[data-item-id]").forEach(ci => {
    ci.addEventListener("touchstart", e => {
      const t = e.touches[0];
      startX = t.clientX; startY = t.clientY;
      activated = false;
      clearTimeout(timer);
      timer = setTimeout(() => {
        activated = true;
        dragEl = ci; dragType = "item";
        navigator.vibrate && navigator.vibrate([15, 30]);
        ci.style.opacity = "0.1";
        placeholder = mkPlaceholder(ci.offsetHeight);
        ci.parentNode.insertBefore(placeholder, ci.nextSibling);
        ghost = mkGhost(ci);
      }, 500);
    }, { passive: true });

    ci.addEventListener("touchmove", e => {
      const t = e.touches[0];
      if (!activated) {
        if (Math.abs(t.clientX - startX) > 10 || Math.abs(t.clientY - startY) > 10) clearTimeout(timer);
        return;
      }
      e.preventDefault();
      moveGhost(t.clientX, t.clientY);
      updatePlaceholderItem(t.clientY);
    }, { passive: false });

    ci.addEventListener("touchend", e => {
      clearTimeout(timer);
      if (!activated || dragEl !== ci) { cleanup(); return; }
      if (placeholder && placeholder.parentNode) placeholder.parentNode.insertBefore(dragEl, placeholder);
      cleanup();
      saveReorderedData();
    });

    ci.addEventListener("touchcancel", () => { clearTimeout(timer); cleanup(); });
  });

  // セクション
  body.querySelectorAll("div[data-sec-id]").forEach(wrap => {
    const handle = wrap.querySelector(".sec-title");
    if (!handle) return;

    handle.addEventListener("touchstart", e => {
      const t = e.touches[0];
      startX = t.clientX; startY = t.clientY;
      activated = false;
      clearTimeout(timer);
      timer = setTimeout(() => {
        activated = true;
        dragEl = wrap; dragType = "section";
        navigator.vibrate && navigator.vibrate([15, 30]);
        wrap.style.opacity = "0.1";
        placeholder = mkPlaceholder(80);
        body.insertBefore(placeholder, wrap.nextSibling);
        ghost = mkGhost(handle);
      }, 500);
    }, { passive: true });

    handle.addEventListener("touchmove", e => {
      const t = e.touches[0];
      if (!activated) {
        if (Math.abs(t.clientX - startX) > 10 || Math.abs(t.clientY - startY) > 10) clearTimeout(timer);
        return;
      }
      e.preventDefault();
      moveGhost(t.clientX, t.clientY);
      updatePlaceholderSection(t.clientY);
    }, { passive: false });

    handle.addEventListener("touchend", () => {
      clearTimeout(timer);
      if (!activated || dragEl !== wrap) { cleanup(); return; }
      if (placeholder && placeholder.parentNode) placeholder.parentNode.insertBefore(dragEl, placeholder);
      cleanup();
      saveReorderedData();
    });

    handle.addEventListener("touchcancel", () => { clearTimeout(timer); cleanup(); });
  });
}

async function saveReorderedData() {
  const proc = getProc(); if (!proc) return;
  const body = $("check-body"); if (!body) return;

  // セクションの新しい順序を取得
  const newSections = [];
  body.querySelectorAll("div[data-sec-id]").forEach(wrap => {
    const secId = wrap.dataset.secId;
    const sec = proc.sections.find(s => s.id===secId);
    if (!sec) return;
    // セクション内のアイテムの新しい順序を取得
    const newItems = [];
    wrap.querySelectorAll(".ci[data-item-id]").forEach(ci => {
      const itemId = ci.dataset.itemId;
      const item = sec.items.find(i => i.id===itemId);
      if (item) newItems.push(item);
    });
    newSections.push({ ...sec, items: newItems });
  });

  proc.sections = newSections;
  await DB.set("md_data", S.data);
  toast("順序を保存しました");
  // UIを再描画せず（ドラッグ後のDOMがそのまま正しい状態）
}

function updateProg() {
  const proc = getProc(); if (!proc) return;
  const total = proc.sections.reduce((n,s) => n+s.items.length, 0);
  const done = (S.checked[proc.id]||[]).length;
  $("prog-txt").textContent = `${done} / ${total}`;
  $("prog-fill").style.width = (total ? done/total*100 : 0)+"%";
}

// NOTE SHEET
// ============================================================
function findProcById(modKey, procId) {
  return (S.data.procedures[modKey]||[]).find(p => p.id===procId) || null;
}

function findItemInProc(proc, itemId) {
  if (!proc || !itemId) return null;
  for (const sec of proc.sections||[]) {
    const item = (sec.items||[]).find(it => it.id===itemId);
    if (item) return item;
  }
  return null;
}

function noteTargetFrom(mod, proc, item) {
  return {
    modKey: mod?.key || "",
    procId: proc?.id || "",
    procTitle: proc?.title || "（手順指定なし）",
    itemId: item?.id || "",
    itemText: item?.text || "（項目指定なし）"
  };
}

function noteTargetFromNote(note) {
  const proc = findProcById(note.modKey, note.procId);
  const item = findItemInProc(proc, note.itemId);
  return {
    modKey: note.modKey || "",
    procId: note.procId || "",
    procTitle: proc?.title || note.procTitle || "（手順指定なし）",
    itemId: item?.id || note.itemId || "",
    itemText: item?.text || note.itemText || "（項目指定なし）"
  };
}

function noteTargetHtml(target) {
  if (!target?.procId) return "手順・項目の指定なし";
  const mod = S.data.modalities.find(m => m.key===target.modKey);
  return `<b>${esc(mod?.label || "")} / ${esc(target.procTitle || "")}</b>${target.itemId ? `<br><span style="font-size:12px;">${esc(target.itemText || "")}</span>` : " · 項目指定なし"}`;
}

function noteTypeClass(type) {
  return type==="mistake" ? "m" : type==="question" ? "q" : "i";
}

function noteTypeLabel(type) {
  return type==="mistake" ? "⚠ ミス" : type==="question" ? "？疑問" : "💡 気づき";
}

function noteTextLabel(type) {
  return type==="mistake" ? "何を間違えた / 忘れた?" : type==="question" ? "疑問点" : "何に気づいた?";
}

function noteTextPlaceholder(type) {
  return type==="mistake" ? "例: フットスイッチ確認を忘れた" : type==="question" ? "例: この手順で確認する理由を後で調べたい" : "例: カテ進めるとき抵抗があった";
}

function noteButtonClass(type) {
  return type==="mistake" ? "m" : type==="question" ? "a" : "i";
}

function renderNoteTargetPicker(target, onSelect, onBack) {
  $("sheet-body").innerHTML = `
    <h2>検査項目を変更</h2>
    <div class="ctx-txt">${noteTargetHtml(target)}</div>
    <p style="color:var(--dim);font-size:13px;margin-bottom:14px;">記録に紐づける手順・項目を選んでください。</p>
    <div id="note-target-list"></div>
    <div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--line);">
      <button class="btn-main a" style="background:var(--bg2);color:var(--dim);border:1px solid var(--line);" id="note-no-target">📝 手順・項目を指定しない</button>
    </div>
    <button class="btn-sub" id="note-target-back" style="margin-top:8px;">‹ 戻る</button>`;

  $("note-target-back").onclick = onBack;
  $("note-no-target").onclick = () => onSelect(noteTargetFrom(null, null, null));

  const list = $("note-target-list");
  S.data.modalities.forEach(mod => {
    const procs = S.data.procedures[mod.key] || [];
    if (!procs.length) return;
    const g = document.createElement("div");
    g.innerHTML = `<div style="font-size:11px;color:${mod.c||"var(--accent)"};font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin:10px 2px 6px;">${esc(mod.label)}</div>`;
    procs.forEach(proc => {
      const procBtn = document.createElement("button");
      procBtn.style.cssText = "width:100%;background:var(--bg2);border:1px solid var(--line);border-left:3px solid "+(mod.c||"var(--accent)")+";border-radius:10px;padding:11px 14px;text-align:left;font-size:14px;font-weight:600;margin-bottom:6px;color:var(--text);";
      procBtn.textContent = proc.title + "（項目指定なし）";
      procBtn.onclick = () => onSelect(noteTargetFrom(mod, proc, null));
      g.appendChild(procBtn);

      proc.sections.forEach(sec => {
        sec.items.forEach(it => {
          const itemBtn = document.createElement("button");
          itemBtn.style.cssText = "width:100%;background:var(--bg1);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;font-size:13px;line-height:1.45;margin-bottom:6px;color:var(--text);";
          itemBtn.innerHTML = `<span style="display:block;color:var(--mute);font-size:10px;margin-bottom:2px;">${esc(proc.title)} / ${esc(sec.heading)}</span>${esc(it.text)}`;
          itemBtn.onclick = () => onSelect(noteTargetFrom(mod, proc, it));
          g.appendChild(itemBtn);
        });
      });
    });
    list.appendChild(g);
  });
}

function openNoteSheet(proc, item, initType) {
  let typ = initType;
  let target = noteTargetFrom(S.data.modalities.find(m => m.key===S.currentMod), proc, item);
  function render() {
    const isM = typ==="mistake";
    const textValue = $("note-ta")?.value || "";
    const questionValue = $("note-question")?.value || "";
    $("sheet-body").innerHTML = `
      <h2>${isM?"⚠ ミスを記録":"💡 気づきを記録"}</h2>
      <div class="type-banner ${isM?"m":"i"}">
        <span>${isM?"⚠ ミス":"💡 気づき"}</span>
        <button class="sw" id="sw-btn">${isM?"→ 気づきに変更":"→ ミスに変更"}</button>
      </div>
      <div class="target-change">
        <div class="ctx-txt"><b>対象:</b><br>${noteTargetHtml(target)}</div>
        <button class="target-btn" id="note-change-target">変更</button>
      </div>
      <label class="form-lbl">${isM?"何を間違えた / 忘れた?":"何に気づいた?"}</label>
      <textarea class="form-input" id="note-ta" placeholder="${isM?"例: フットスイッチ確認を忘れた":"例: カテ進めるとき抵抗があった"}"></textarea>
      <label class="form-lbl">疑問点（任意）</label>
      <textarea class="form-input" id="note-question" style="min-height:72px;" placeholder="例: この手順で確認する理由を後で調べたい"></textarea>
      <button class="btn-main ${isM?"m":"i"}" id="note-save">保存する</button>
      <button class="btn-sub" id="note-cancel">キャンセル</button>`;
    $("note-ta").value = textValue;
    $("note-question").value = questionValue;
    $("sw-btn").onclick = e => {
      e.stopPropagation();
      typ = typ==="mistake"?"insight":"mistake";
      render(); $("note-ta").focus();
    };
    $("note-change-target").onclick = () => {
      const text = $("note-ta").value;
      const question = $("note-question").value;
      renderNoteTargetPicker(target, next => { target = next; render(); $("note-ta").value = text; $("note-question").value = question; }, () => { render(); $("note-ta").value = text; $("note-question").value = question; });
    };
    $("note-cancel").onclick = closeSheet;
    $("note-save").onclick = async () => {
      const text = $("note-ta").value.trim();
      const question = $("note-question").value.trim();
      if (!text) { toast("内容を入力してください"); $("note-ta").focus(); return; }
      S.notes.push({ id:genId("n"), t:Date.now(), type:typ, ...target, text, question });
      await DB.set("md_notes", S.notes);
      closeSheet(); renderCheck();
      toast(typ==="mistake"?"⚠ ミスを記録しました":"💡 気づきを記録しました");
    };
    setTimeout(() => $("note-ta")?.focus(), 320);
  }
  $("scrim").classList.add("on");
  $("sheet").classList.add("on");
  render();
}

function openEditNoteSheet(id) {
  const note = S.notes.find(n => n.id===id);
  if (!note) return;
  let typ = note.type || "insight";
  let target = noteTargetFromNote(note);

  function render() {
    const isM = typ==="mistake";
    const isQ = typ==="question";
    const textValue = $("edit-note-ta")?.value ?? note.text ?? "";
    const questionValue = $("edit-note-question")?.value ?? note.question ?? "";
    $("sheet-body").innerHTML = `
      <h2>${noteTypeLabel(typ)}を編集</h2>
      <div class="type-banner ${isM?"m":"i"}" style="${isQ ? "background:rgba(77,208,197,.12);color:var(--accent);border-color:rgba(77,208,197,.3);" : ""}">
        <span>${noteTypeLabel(typ)}</span>
        ${isQ ? "" : `<button class="sw" id="edit-sw-btn">${isM?"→ 気づきに変更":"→ ミスに変更"}</button>`}
      </div>
      <div class="target-change">
        <div class="ctx-txt"><b>対象:</b><br>${noteTargetHtml(target)}</div>
        <button class="target-btn" id="edit-change-target">変更</button>
      </div>
      <label class="form-lbl">${noteTextLabel(typ)}</label>
      <textarea class="form-input" id="edit-note-ta" placeholder="${noteTextPlaceholder(typ)}"></textarea>
      ${isQ ? "" : `
        <label class="form-lbl">疑問点（任意）</label>
        <textarea class="form-input" id="edit-note-question" style="min-height:72px;" placeholder="例: この手順で確認する理由を後で調べたい"></textarea>
      `}
      <button class="btn-main ${noteButtonClass(typ)}" id="edit-note-save">保存する</button>
      <button class="btn-sub" id="edit-note-cancel">キャンセル</button>`;
    $("edit-note-ta").value = textValue;
    if ($("edit-note-question")) $("edit-note-question").value = questionValue;
    if ($("edit-sw-btn")) $("edit-sw-btn").onclick = e => {
        e.stopPropagation();
        typ = typ==="mistake"?"insight":"mistake";
        render(); $("edit-note-ta").focus();
      };
    $("edit-change-target").onclick = () => {
      const text = $("edit-note-ta").value;
      const question = $("edit-note-question")?.value || "";
      renderNoteTargetPicker(target, next => { target = next; render(); $("edit-note-ta").value = text; if ($("edit-note-question")) $("edit-note-question").value = question; }, () => { render(); $("edit-note-ta").value = text; if ($("edit-note-question")) $("edit-note-question").value = question; });
    };
    $("edit-note-cancel").onclick = closeSheet;
    $("edit-note-save").onclick = async () => {
      const text = $("edit-note-ta").value.trim();
      const question = isQ ? "" : $("edit-note-question").value.trim();
      if (!text) { toast("内容を入力してください"); $("edit-note-ta").focus(); return; }
      Object.assign(note, { type:typ, ...target, text, question });
      await DB.set("md_notes", S.notes);
      closeSheet();
      if ($("v-check").classList.contains("active")) renderCheck();
      if ($("v-notes").classList.contains("active")) renderNotes();
      toast("保存しました");
    };
    setTimeout(() => $("edit-note-ta")?.focus(), 320);
  }

  $("scrim").classList.add("on");
  $("sheet").classList.add("on");
  render();
}

async function delNote(id) {
  if (!confirm("この記録を削除しますか?")) return;
  S.notes = S.notes.filter(n => n.id!==id);
  await DB.set("md_notes", S.notes);
  renderCheck();
  if ($("v-notes").classList.contains("active")) renderNotes();
  toast("削除しました");
}

    <label class="form-lbl">タイトル</label>

function editSec(secId) { openSecEditor(getProc().sections.find(s => s.id===secId)); }
function delSec(secId) {

// ============================================================
// 手順検索
// ============================================================
function searchProcs() {
  const q = ($("proc-search-input")?.value||"").trim().toLowerCase();
  const results = $("proc-search-results");
  if (!results) return;
  if (!q) { results.innerHTML = `<div class="empty" style="padding:30px 0;">キーワードを入力すると<br>手順を横断検索できます</div>`; return; }
  const hits = [];
  S.data.modalities.forEach(mod => {
    (S.data.procedures[mod.key]||[]).forEach(proc => {
      proc.sections.forEach(sec => {
        sec.items.forEach(it => {
          if ((it.text+" "+(it.note||"")+" "+sec.heading).toLowerCase().includes(q)) {
            hits.push({ mod:mod.label, proc:proc.title, procId:proc.id, modKey:mod.key, sec:sec.heading, item:it });
          }
        });
      });
    });
  });
  if (!hits.length) { results.innerHTML = `<div class="empty" style="padding:30px 0;">「${q}」に一致する手順が見つかりません</div>`; return; }
  results.innerHTML = `<div style="font-size:12px;color:var(--mute);margin-bottom:10px;">${hits.length} 件ヒット</div>`;
  hits.forEach(h => {
    const card = document.createElement("div");
    card.style.cssText = "background:var(--bg1);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;cursor:pointer;";
    const hl = h.item.text.replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi"), m => `<span class="search-hl">${m}</span>`);
    card.innerHTML = `
      <div style="font-size:11px;color:var(--mute);margin-bottom:4px;">${esc(h.mod)} › ${esc(h.proc)} › ${esc(h.sec)}</div>
      <div style="font-size:14px;">${hl}</div>
      ${h.item.note?`<div style="font-size:12px;color:var(--dim);margin-top:4px;border-left:2px solid var(--line);padding-left:8px;">${esc(h.item.note)}</div>`:""}
      <div style="font-size:11px;color:var(--accent);margin-top:6px;">→ 該当手順を開く</div>`;
    card.onclick = () => openChecklist(h.modKey, h.procId);
    results.appendChild(card);
  });
}

async function addPDF(input) {
  const file = input.files[0]; if (!file) return;
  toast("読み込み中...");
  const reader = new FileReader();
  reader.onload = async e => {
    const pdfs = await DB.get("md_pdfs", []);
    pdfs.push({ id:genId("pdf"), name:file.name, data:e.target.result, src:"local", t:Date.now() });
    await DB.set("md_pdfs", pdfs);
    toast("PDFを保存しました"); renderPDFs();
    input.value = "";
  };
  reader.readAsDataURL(file);
}

function exportText() {
  let txt = `■ 検査補助アプリ 手順データ\n出力日時: ${new Date().toLocaleString("ja-JP")}\n\n`;
  S.data.modalities.forEach(mod => {
    const procs = S.data.procedures[mod.key]||[];
    if (!procs.length) return;
    txt += `\n▼ ${mod.label} (${mod.sub})\n${"=".repeat(40)}\n`;
    procs.forEach(proc => {
      txt += `\n【${proc.title}】\n`;
      if (proc.desc) txt += `${proc.desc}\n`;
      proc.sections.forEach(sec => {
        txt += `\n◆ ${sec.heading}\n`;
        sec.items.forEach((it, i) => {
          let line = `  ${i+1}. ${it.text}`;
          if (it.warn) line += ` [${it.warn}]`;
          if (it.danger) line += ` [${it.danger}]`;
          txt += line + "\n";
          if (it.note) txt += `     ↳ ${it.note}\n`;
        });
      });
    });
  });

  $("export-preview").innerHTML = `
    <div class="shdr">プレビュー</div>
    <pre style="background:var(--bg1);border:1px solid var(--line);border-radius:var(--r);padding:14px;font-size:11px;color:var(--dim);overflow-x:auto;white-space:pre-wrap;word-break:break-all;max-height:300px;overflow-y:auto;">${esc(txt)}</pre>
    <button class="btn-main a" style="margin-top:10px;" onclick="copyText(${JSON.stringify(txt).replace(/</g,'&lt;')})">📋 クリップボードにコピー</button>`;
  window._exportTxt = txt;
  $("rt-export").querySelector("button[onclick='exportText()']").textContent = "✅ テキスト出力完了（下にプレビュー）";
}

function copyText(txt) {
  const t = txt || window._exportTxt;
  if (!t) return;
  navigator.clipboard.writeText(t).then(() => toast("コピーしました！")).catch(() => {
    // フォールバック
    const ta = document.createElement("textarea");
    ta.value = t; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); document.body.removeChild(ta);
    toast("コピーしました！");
  });
}

function exportJSON() {
  const json = JSON.stringify({ version:1, exportedAt: new Date().toISOString(), data: S.data }, null, 2);
  const blob = new Blob([json], { type:"application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `kensa_data_${new Date().toLocaleDateString("ja-JP").replace(/\//g,"-")}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast("JSONをダウンロードしました");
}

      <input type="file" accept=".json,application/json" id="import-input" style="display:none;" onchange="importJSON(this)">
    </label>
    <button class="btn-sub" onclick="closeSheet()">キャンセル</button>`);
}

function importJSON(input) {
  const file = input.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = async e => {
    try {
      const parsed = JSON.parse(e.target.result);
      if (!parsed.data || !parsed.data.modalities) { toast("無効なファイルです"); return; }
      S.data = parsed.data;
      await DB.set("md_data", S.data);
      closeSheet(); renderHome();
      toast("インポートしました！");
    } catch { toast("ファイルの読み込みに失敗しました"); }
  };
  reader.readAsText(file);
}

function _dnsStep3(item) {
  const isM = _dns.typ === "mistake";
  const isQ = _dns.typ === "question";
  const hasProc = !!_dns.proc;
  _dns.item = item;
  $("sheet-body").innerHTML = `
    <h2>${noteTypeLabel(_dns.typ)}を記録</h2>
    <div class="type-banner ${isM ? "m" : "i"}" style="${isQ ? "background:rgba(77,208,197,.12);color:var(--accent);border-color:rgba(77,208,197,.3);" : ""}">

    </div>

        ${hasProc

      <button class="target-btn" id="dns-change-target">${hasProc ? "変更" : "検査項目を選ぶ"}</button>
    </div>
    <label class="form-lbl">${noteTextLabel(_dns.typ)}</label>
    <textarea class="form-input" id="dns-text" placeholder="${noteTextPlaceholder(_dns.typ)}"></textarea>

  $("dns-change-target").onclick = () => {
    const text = $("dns-text")?.value || "";
    const question = $("dns-question")?.value || "";
    _dnsStep1();
    window._pendingDnsText = text;
    window._pendingDnsQuestion = question;
  };
  $("dns-back").onclick = closeSheet;
  $("dns-save").onclick = async () => {
    const text = $("dns-text")?.value.trim();
    const question = isQ ? "" : $("dns-question")?.value.trim();

  setTimeout(() => $("dns-text")?.focus(), 320);
}

  // 今日のログ

      const color = pct===100?"#5ed29a":pct>=50?"var(--insight)":"var(--danger)";
      const labelMap = { today:"今日の目標", week:"今週の目標", month:"今月の目標" };
      const c = document.createElement("div");
      c.style.cssText = "background:var(--bg1);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:8px;";

        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
          <span style="font-size:12px;color:var(--mute);">${l.time} の記録</span>
          <span style="font-size:22px;font-weight:800;color:${color};">${pct}%</span>
        </div>
        ${["today","week","month"].filter(k => l.checks[k] !== undefined).map(k => `
          <div style="background:var(--bg2);border-radius:10px;padding:10px 12px;margin-bottom:8px;">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
              <span style="font-size:18px;flex-shrink:0;">${l.checks[k] ? "✅" : "❌"}</span>
              <span style="font-size:12px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;">${labelMap[k]}</span>

            <div style="font-size:14px;color:var(--text);line-height:1.5;padding-left:26px;">${esc(l.goals?.[k]||"（目標未記録）")}</div>

                💬 理由: ${esc(l.reasons[k])}
              </div>` : ""}
          </div>`).join("")}`;
      logEl.appendChild(c);
    });

  // 明日の検査予定エリア

function openGoalCheck() {
  DB.get("md_goals", { today:"", week:"", month:"" }).then(goals => {
    const defs = [
      { key:"today", label:"今日の目標", icon:"📅" },
      { key:"week",  label:"今週の目標", icon:"📆" },
      { key:"month", label:"今月の目標", icon:"🗓️" }
    ].filter(d => goals[d.key]);

    if (!defs.length) { toast("目標が設定されていません"); return; }

    const st = {};
    defs.forEach(d => { st[d.key] = null; });

    function rc() {
      $("sheet-body").innerHTML = `
        <h2>✅ 達成チェック</h2>
        <p style="color:var(--dim);font-size:13px;margin-bottom:14px;">各目標の達成状況を記録します</p>
        ${defs.map(d => `
          <div style="background:var(--bg2);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;">
            <div style="font-size:12px;font-weight:700;margin-bottom:4px;">${d.icon} ${d.label}</div>
            <div style="font-size:14px;margin-bottom:10px;">${esc(goals[d.key])}</div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;">
              <button data-k="${d.key}" data-v="1" class="gc-btn"
                style="padding:10px;border-radius:8px;border:1.5px solid ${st[d.key]===true?"#5ed29a":"var(--line)"};background:${st[d.key]===true?"rgba(94,210,154,.15)":"var(--bg1)"};color:${st[d.key]===true?"#5ed29a":"var(--dim)"};font-weight:700;">
                ✅ 達成
              </button>
              <button data-k="${d.key}" data-v="0" class="gc-btn"
                style="padding:10px;border-radius:8px;border:1.5px solid ${st[d.key]===false?"var(--danger)":"var(--line)"};background:${st[d.key]===false?"rgba(245,101,101,.1)":"var(--bg1)"};color:${st[d.key]===false?"var(--danger)":"var(--dim)"};font-weight:700;">
                ❌ 未達成
              </button>
            </div>
            ${st[d.key]===false ? `<textarea class="form-input" id="rsn-${d.key}" style="margin-top:8px;min-height:70px;margin-bottom:0;" placeholder="なぜ達成できなかったか…"></textarea>` : ""}
          </div>`).join("")}
        <button class="btn-main a" id="gc-save">記録する</button>
        <button class="btn-sub" onclick="closeSheet()" style="margin-top:8px;">キャンセル</button>`;

      $("sheet-body").querySelectorAll(".gc-btn").forEach(btn => {
        btn.onclick = () => { st[btn.dataset.k] = btn.dataset.v === "1"; rc(); };
      });

      $("gc-save").onclick = async () => {
        if (defs.some(d => st[d.key] === null)) { toast("すべての目標にチェックを入れてください"); return; }
        const reasons = {};
        defs.forEach(d => { if (st[d.key] === false) reasons[d.key] = $(`rsn-${d.key}`)?.value.trim() || ""; });
        const now = new Date();
        const log = {
          id: genId("gl"), t: Date.now(),
          date: now.toLocaleDateString("ja-JP"),
          time: now.toLocaleTimeString("ja-JP", { hour:"2-digit", minute:"2-digit" }),
          checks: { ...st }, reasons,
          goals: { today: goals.today, week: goals.week, month: goals.month },
          done: defs.filter(d => st[d.key]).length,
          total: defs.length
        };
        const logs = await loadGoalLogs();
        logs.push(log);

function shuffle(arr) {
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function startQuiz(procId, setId) {
  const bank=QUIZ_BANK[procId];
  const set=bank.sets.find(s=>s.id===setId);
  QS.currentBank=procId; QS.currentSet=set;
  QS.current=0; QS.answers=[]; QS.score=0;
  if(set.type==="order"){ QS.questions=[{type:"order",...set}]; QS.sortOrder=shuffle([...set.items]); }
  else if(set.type==="truefalse") QS.questions=shuffle(set.questions).map(q=>({type:"truefalse",...q}));
  else if(set.type==="choice") QS.questions=shuffle(set.questions).map(q=>({type:"choice",...q}));
  else if(set.type==="fill") QS.questions=set.questions.map(q=>({type:"fill",...q}));
  else if(set.type==="mixed") QS.questions=buildMixed(procId,set.questionCount);
  $("quiz-home").style.display="none";
  $("quiz-result").style.display="none";
  $("quiz-body").style.display="block";
  renderQuestion();
}

function buildMixed(procId,count){
  const bank=QUIZ_BANK[procId];
  const pool=[];
  bank.sets.forEach(set=>{
    if(set.type==="truefalse") set.questions.forEach(q=>pool.push({type:"truefalse",...q}));
    if(set.type==="choice") set.questions.forEach(q=>pool.push({type:"choice",...q}));
    if(set.type==="fill") set.questions.forEach(q=>pool.push({type:"fill",...q}));
  });
  return shuffle(pool).slice(0,count);
}

function renderQuestion(){
  const body=$("quiz-body"); if(!body)return;
  const q=QS.questions[QS.current];
  const total=QS.questions.length;
  const pct=Math.round((QS.current/total)*100);
  const tLabel={order:"並び替え",truefalse:"○×問題",fill:"穴埋め",choice:"4択問題"}[q.type];
  let html="";
  if(q.type==="order") html=renderOrderQ(q);
  else if(q.type==="truefalse") html=renderTFQ(q);
  else if(q.type==="choice") html=renderChoiceQ(q);
  else if(q.type==="fill") html=renderFillQ(q);
  body.innerHTML=`
    <div class="q-prog-row">
      <span class="q-num">${QS.current+1} / ${total}</span>
      <div class="q-prog-bar"><div class="q-prog-fill" style="width:${pct}%"></div></div>
      <span class="q-type-badge q-type-${q.type}">${tLabel}</span>
    </div>${html}`;
  if(q.type==="order") initSortDrag();
}

function renderOrderQ(q){
  return `<div class="q-question">以下の手順を正しい順序に並び替えてください<div style="font-size:13px;color:var(--dim);font-weight:400;margin-top:4px;">${esc(q.desc||"")}</div></div>
  <div class="sort-list" id="sort-list">${QS.sortOrder.map((it,i)=>`
    <div class="sort-item" draggable="true" data-id="${it.id}">
      <span class="sort-handle">⠿</span><span class="sort-num">${i+1}</span><span class="sort-text">${esc(it.text)}</span>
    </div>`).join("")}</div>
  <button class="btn-main a" onclick="checkOrder()">この順序で確認</button>`;
}

function initSortDrag(){
  const list=$("sort-list"); if(!list)return;
  let dragSrc=null;
  const updateNums=()=>list.querySelectorAll(".sort-item").forEach((el,i)=>el.querySelector(".sort-num").textContent=i+1);
  const updateOrder=()=>{ QS.sortOrder=[...list.querySelectorAll(".sort-item")].map(el=>QS.questions[QS.current].items.find(it=>it.id===el.dataset.id)); };
  list.querySelectorAll(".sort-item").forEach(item=>{
    item.addEventListener("dragstart",()=>{ dragSrc=item; setTimeout(()=>item.style.opacity=".4",0); });
    item.addEventListener("dragend",()=>{ item.style.opacity="1"; list.querySelectorAll(".sort-item").forEach(i=>i.classList.remove("drag-over")); });
    item.addEventListener("dragover",e=>{ e.preventDefault(); item.classList.add("drag-over"); });
    item.addEventListener("dragleave",()=>item.classList.remove("drag-over"));
    item.addEventListener("drop",e=>{
      e.preventDefault(); item.classList.remove("drag-over");
      if(dragSrc===item)return;
      const all=[...list.querySelectorAll(".sort-item")];
      if(all.indexOf(dragSrc)<all.indexOf(item)) list.insertBefore(dragSrc,item.nextSibling);
      else list.insertBefore(dragSrc,item);
      updateNums(); updateOrder();
    });
    // Touch対応
    let touchTarget=null;
    item.addEventListener("touchstart",()=>{ dragSrc=item; },{passive:true});
    item.addEventListener("touchmove",e=>{
      e.preventDefault();
      const t=e.touches[0];
      const el=document.elementFromPoint(t.clientX,t.clientY)?.closest(".sort-item");
      list.querySelectorAll(".sort-item").forEach(i=>i.classList.remove("drag-over"));
      if(el&&el!==dragSrc){ el.classList.add("drag-over"); touchTarget=el; }
    },{passive:false});
    item.addEventListener("touchend",()=>{
      list.querySelectorAll(".sort-item").forEach(i=>i.classList.remove("drag-over"));
      if(touchTarget&&touchTarget!==dragSrc){
        const all=[...list.querySelectorAll(".sort-item")];
        if(all.indexOf(dragSrc)<all.indexOf(touchTarget)) list.insertBefore(dragSrc,touchTarget.nextSibling);
        else list.insertBefore(dragSrc,touchTarget);
        updateNums(); updateOrder();
      }
      touchTarget=null;
    });
  });
}

function checkOrder(){
  const q=QS.questions[QS.current];
  const userOrder=[...$("sort-list").querySelectorAll(".sort-item")].map(el=>el.dataset.id);
  const correct=JSON.stringify(userOrder)===JSON.stringify(q.correctOrder);
  if(correct)QS.score++;
  QS.answers.push({type:"order",correct,question:q.desc||q.name});
  const body=$("quiz-body");
  const fb=document.createElement("div");
  fb.className=`q-feedback ${correct?"ok":"ng"}`;
  fb.innerHTML=`<div>${correct?"✅ 正解！":"❌ 不正解"}</div>
    ${!correct?`<div style="margin-top:6px;font-size:13px;color:var(--text);">正しい順序:</div><ol style="margin:6px 0 0 16px;font-size:13px;color:var(--dim);">${q.correctOrder.map(id=>{const it=q.items.find(i=>i.id===id);return`<li style="margin-bottom:2px;">${esc(it.text)}</li>`;}).join("")}</ol>`:""}
    <div style="font-size:13px;color:var(--dim);margin-top:6px;">${esc(q.explanation||"")}</div>`;
  body.appendChild(fb);
  appendNextBtn();
  body.querySelector(".btn-main[onclick='checkOrder()']").style.display="none";
}

function renderTFQ(q){
  return `<div class="q-question">${esc(q.text)}</div>
  <div class="choice-list">
    <button class="choice-btn" onclick="answerTF(true,this)">⭕ 正しい</button>
    <button class="choice-btn" onclick="answerTF(false,this)">❌ 間違い</button>
  </div>`;
}

function answerTF(ans,btn){
  const q=QS.questions[QS.current];
  const correct=ans===q.answer;
  if(correct)QS.score++;
  QS.answers.push({type:"truefalse",correct,question:q.text});
  $("quiz-body").querySelectorAll(".choice-btn").forEach(b=>{
    b.disabled=true;
    if((b.textContent.includes("正しい")&&q.answer===true)||(b.textContent.includes("間違い")&&q.answer===false)) b.classList.add("correct");
    else b.classList.add("wrong");
  });
  showFB(correct,`正解: ${q.answer?"⭕ 正しい":"❌ 間違い"}`,q.explanation);
}

function renderChoiceQ(q){
  return `<div class="q-question">${esc(q.text)}</div>
  <div class="choice-list">${q.choices.map((c,i)=>`<button class="choice-btn" onclick="answerChoice(${i},this)">${esc(c)}</button>`).join("")}</div>`;
}

function answerChoice(idx,btn){
  const q=QS.questions[QS.current];
  const correct=idx===q.answer;
  if(correct)QS.score++;
  QS.answers.push({type:"choice",correct,question:q.text});
  $("quiz-body").querySelectorAll(".choice-btn").forEach((b,i)=>{
    b.disabled=true;
    if(i===q.answer)b.classList.add("correct");
    else if(i===idx&&!correct)b.classList.add("wrong");
  });
  showFB(correct,`正解: ${esc(q.choices[q.answer])}`,q.explanation);
}

function renderFillQ(q){
  return `<div class="q-question">${esc(q.text)}</div>
  <div style="font-size:12px;color:var(--dim);margin-bottom:12px;">ヒント: ${esc(q.hint||"")}</div>
  ${q.blanks.map((b,i)=>`<input class="fill-input" id="fill-${i}" type="text" placeholder="${i+1}番目の答えを入力..." autocomplete="off" spellcheck="false">`).join("")}
  <button class="btn-main a" onclick="checkFill()">答え合わせ</button>`;
}

function checkFill(){
  const q=QS.questions[QS.current];
  let allOk=true;
  q.blanks.forEach((ans,i)=>{
    const inp=$(`fill-${i}`);
    const ok=inp.value.trim()===ans||inp.value.trim().toLowerCase()===ans.toLowerCase();
    inp.classList.add(ok?"correct":"wrong"); inp.disabled=true;
    if(!ok)allOk=false;
  });
  if(allOk)QS.score++;
  QS.answers.push({type:"fill",correct:allOk,question:q.text});
  showFB(allOk,`正解: ${q.blanks.join(" / ")}`, "");
  $("quiz-body").querySelector(".btn-main[onclick='checkFill()']").style.display="none";
}

function showFB(correct,ansText,exp){
  const body=$("quiz-body");
  const fb=document.createElement("div");
  fb.className=`q-feedback ${correct?"ok":"ng"}`;
  fb.innerHTML=`<div style="font-weight:700;">${correct?"✅ 正解！":"❌ 不正解"}</div>
    <div style="margin-top:4px;">${ansText}</div>
    ${exp?`<div style="font-size:13px;color:var(--dim);margin-top:4px;">${esc(exp)}</div>`:""}`;
  body.appendChild(fb);
  appendNextBtn();
}

function appendNextBtn(){
  const body=$("quiz-body");
  const btn=document.createElement("button");
  btn.className="btn-main a"; btn.style.marginTop="8px";
  btn.textContent=QS.current+1<QS.questions.length?"次の問題 →":"結果を見る";
  btn.onclick=()=>{ QS.current++; QS.current<QS.questions.length?renderQuestion():showResult(); };
  body.appendChild(btn);
}

function showResult(){
  $("quiz-body").style.display="none";
  const result=$("quiz-result"); result.style.display="block";
  const total=QS.questions.length;
  const pct=Math.round((QS.score/total)*100);
  const msg=pct>=90?"🏆 完璧です！":pct>=70?"👍 よくできました！":pct>=50?"📖 もう少し復習しましょう":"💪 しっかり復習が必要です";
  const color=pct>=80?"#5ed29a":pct>=60?"var(--insight)":"var(--danger)";
  const hKey="quiz_history_"+QS.currentBank;
  const hist=JSON.parse(localStorage.getItem(hKey)||"[]");
  hist.push({t:Date.now(),setName:QS.currentSet.name,correct:QS.score,total,pct});
  localStorage.setItem(hKey,JSON.stringify(hist.slice(-20)));
  localStorage.setItem(`quiz_${QS.currentBank}_${QS.currentSet.id}`,JSON.stringify([{t:Date.now(),pct}]));
  result.innerHTML=`
    <div class="result-score">
      <div class="score-num" style="color:${color};">${QS.score}<span class="score-max"> / ${total}</span></div>
      <div style="font-size:18px;color:${color};margin-top:4px;font-weight:700;">${pct}%</div>
      <div class="score-msg">${msg}</div>
    </div>
    <div class="shdr" style="margin-top:8px;">問題ごとの結果</div>
    ${QS.answers.map((a,i)=>`
      <div class="result-item">
        <span style="font-size:18px;flex-shrink:0;">${a.correct?"✅":"❌"}</span>
        <div style="font-size:13px;color:var(--dim);flex:1;"><b style="color:var(--text);">Q${i+1}.</b> ${esc(a.question.length>60?a.question.slice(0,60)+"...":a.question)}</div>
      </div>`).join("")}
    <button class="btn-main a" style="margin-top:16px;" onclick="startQuiz(QS.currentBank,QS.currentSet.id)">もう一度挑戦</button>
    <button class="btn-sub" onclick="backToQuizHome()">テスト一覧に戻る</button>`;
}

function backToQuizHome(){
  $("quiz-result").style.display="none";
  $("quiz-body").style.display="none";
  $("quiz-home").style.display="block";
  renderQuizHome();
}

// ============================================================
// INIT
// ============================================================
(async function init() {

  // ── localStorage → IndexedDB 自動移行 ──────────────────
  // 移行フラグを一度リセットして確実に再移行
  const migrated = await DB.get("ls_migrated_v2", false);
  if (!migrated) {
    try {
      // 旧バージョンで使われていたキー名を全パターン試す
      const keys = [
        ["md_data",    "md_data"],
        ["md_checked", "md_checked"],
        ["md_notes",   "md_notes"],
        ["md_pdfs",    "md_pdfs"],
        ["md_memos",   "md_memos"],
      ];
      let found = false;
      for (const [lsKey, dbKey] of keys) {
        const val = localStorage.getItem(lsKey);
        if (val) {
          await DB.set(dbKey, JSON.parse(val));
          found = true;
          console.log("移行:", lsKey);
        }
      }
      await DB.set("ls_migrated_v2", true);
      if (found) console.log("✅ 移行完了");
    } catch(e) {
      console.warn("移行エラー:", e);
    }
  }
  // ────────────────────────────────────────────────────────

  const saved = await DB.get("md_data", null);
  S.data    = saved || JSON.parse(JSON.stringify(DEFAULT));
  S.checked = await DB.get("md_checked", {});
  S.notes   = await DB.get("md_notes",   []);

  renderHome();
  renderGoals();
})();
</script>
